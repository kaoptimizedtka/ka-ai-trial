<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KA-AI Chat</title>
<style>
:root{--g:#141b4d;--gr:#11c526;--gl:#e6f8e9;--ink:#14202b;--mute:#6b7280;--line:#e3e6ef}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}a{text-decoration:none}
header{background:var(--g);color:#fff;padding:10px 20px;border-bottom:4px solid var(--gr);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.logo{width:36px;height:36px;border-radius:8px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:800;font-size:14px}
header b{font-size:19px}header small{margin-left:auto;font-size:12px;background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 10px}
main{max-width:1180px;margin:0 auto;padding:12px 24px 130px}
.welcome{text-align:center;padding:10px 0;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center}.welcome img{align-self:center}.welcome h1{font-size:34px;margin:14px 0 8px;color:var(--g)}.welcome p{color:var(--mute);margin:0 0 26px;font-size:20px}

.starters{display:grid;grid-template-columns:1fr 1fr;gap:14px}.starters button{background:#fafbfd;border:1px solid var(--line);border-radius:12px;padding:18px 20px;text-align:left;font:inherit;font-size:18px;cursor:pointer}
.starters button:hover{border-color:var(--gr)}@media(max-width:600px){.starters{grid-template-columns:1fr}}
.q{font-size:21px;font-weight:650;margin:18px 0 10px;color:var(--g)}
.ans{white-space:normal}.ov{margin:0 0 14px}.plain{white-space:pre-wrap}
.kp{counter-reset:k;list-style:none;padding:0;margin:0}.kp li{counter-increment:k;position:relative;padding:10px 14px 10px 50px;border:1px solid var(--line);border-left:4px solid var(--gr);border-radius:12px;margin:10px 0;background:#fafbfd}
.kp li::before{content:counter(k);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
a.chip{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gr);color:#fff;font-size:11.5px;font-weight:700;line-height:1;vertical-align:super;margin:0 1px}a.chip:hover{background:var(--g);text-decoration:none}
a.inl:hover{text-decoration:underline}a.inl{color:#1d5fd1;word-break:break-all}
.take{margin:16px 0;font-weight:600;padding:14px 16px;background:#fff8e6;border:1px solid #f3dfa5;border-radius:12px}
.vid a{display:block;padding:10px 14px;border-radius:10px;background:var(--g);color:#fff;margin:8px 0;font-size:15px}
.vid a.ref{background:#fff;color:var(--g);border:1px solid var(--g);margin-left:22px;font-size:14px;padding:7px 12px}
.fu{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}.fu button{text-align:left;background:#fafbfd;border:1px solid var(--line);border-left:4px solid var(--gr);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;color:var(--g);cursor:pointer}.fu button:hover{border-color:var(--gr)}.fu button::before{content:'→  ';color:var(--gr);font-weight:700}
.tools{color:var(--mute);font-size:12px;display:flex;gap:8px;align-items:center;margin-top:6px}
.copy{border:1px solid #ddd;background:#fff;border-radius:8px;padding:4px 8px;color:#555;cursor:pointer;font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:4px}.copy:hover{color:var(--ink);border-color:var(--g)}
.dots::after{content:"…";animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
form{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.row{max-width:1180px;margin:0 auto;display:flex;gap:8px}textarea{flex:1;resize:none;border:1px solid #cfd8d3;border-radius:12px;padding:12px;font:inherit}
button.send{background:var(--gr);font-weight:600;color:#fff;border:0;border-radius:12px;padding:0 20px;font:inherit;cursor:pointer}
.foot{max-width:1180px;margin:6px auto 0;font-size:11px;color:var(--mute);text-align:center}
html.emb header{display:none}
@media(max-width:700px){body{font-size:16px}main{padding:8px 10px 120px}.q{font-size:18px;margin:14px 0 8px}.kp li{padding:9px 10px 9px 40px}.kp li::before{left:9px;top:10px;width:22px;height:22px;font-size:12px}.vid a.ref{margin-left:10px}.take{padding:10px 12px}form{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}.foot{font-size:10px;line-height:1.3}.welcome{padding:6px 0;min-height:calc(100vh - 130px)}.welcome h1{font-size:24px}.welcome p{display:none}.welcome h1{margin:6px 0 12px}.starters{gap:7px}.starters button{font-size:15px;padding:8px 12px;line-height:1.35}.welcome img{width:40px!important;height:40px!important}header img{height:40px!important}}
</style></head><body><script>if(window.self!==window.top)document.documentElement.classList.add('emb')</script>
<header><img src="hdr/image.png" alt="KA-AI Chat" style="height:54px;display:block"></header>
<main id="chat"><div class="welcome" id="welcome"><img src="ic/image.png" alt="" style="width:64px;height:64px"><h1>Welcome to KA-AI Chat</h1><p>Ask anything about KA philosophy, surgical technique, KA-optimized implant design, outcomes and clinical evidence.</p>
<div class="starters">
<button>What are the three kinematic axes of the knee?</button><button>What are the four balancing steps for KA?</button>
<button>Should I use a robot to do KA?</button><button>I like MA-designed implants. Are they compatible with KA?</button>
<button>Why retain the PCL in KA?</button><button>How do I do KA in a valgus knee?</button>
<button>Is implant survival with KA as good as MA?</button><button>How do I verify the femoral resections with a caliper?</button></div></div></main>
<form id="f"><div class="row"><textarea id="q" rows="1" placeholder="Type your question..."></textarea><button class="send">Send</button></div>
<div class="foot">KA-AI Chat is a clinical education tool, not a substitute for surgical judgment. Apply your own clinical expertise in all patient care decisions.</div></form>
<script>
(()=>{const i=document.querySelector(".welcome img");if(i){const l=document.createElement("link");l.rel="icon";l.href=i.src;document.head.appendChild(l)}})();
const URL_="https://adfkanenpirzxjejmbog.supabase.co/functions/v1/ka-chat";
const chat=document.getElementById('chat'),q=document.getElementById('q');let hist=[];const sid='web-'+Math.random().toString(36).slice(2);
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function links(s){let out=[],i=0;while(i<s.length){const a=s.indexOf('[',i);if(a<0){out.push({t:s.slice(i)});break}const b=s.indexOf('](',a);const nl=s.indexOf('\n',a);if(b<0||(nl>=0&&nl<b)){out.push({t:s.slice(i,a+1)});i=a+1;continue}let j=b+2,d=1;while(j<s.length&&d>0){if(s[j]=='(')d++;else if(s[j]==')')d--;else if(/\s/.test(s[j]))break;if(d>0)j++}if(d!==0||!/^https?:\/\//.test(s.slice(b+2))){out.push({t:s.slice(i,a+1)});i=a+1;continue}out.push({t:s.slice(i,a)});out.push({l:s.slice(a+1,b),u:s.slice(b+2,j)});i=j+1}return out}
function inl(s,R){R=R||{m:{},n:0};return links(s).map(p=>p.u?(()=>{const k=p.u;if(!R.m[k])R.m[k]=++R.n;return '<a class="chip" href="'+esc(p.u)+'" target="_blank" rel="noopener" title="'+esc(p.l)+'">'+R.m[k]+'</a>'})():esc(p.t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+[^\s<.,;)])/g,'<a class="inl" href="$1" target="_blank" rel="noopener">$1</a>')).join('').replace(/\s*\(\s*((?:<a class="chip"[^>]*>[^<]*<\/a>[;,\s]*)+)\)/g,(m,g)=>g.replace(/[;,\s]+(?=<a)/g,''))}
function plain(s){return links(s).map(p=>p.u?p.l+' ('+p.u+')':p.t.replace(/\*\*(.+?)\*\*/g,'$1')).join('')}
function render(a){
 const iK=a.indexOf('🔬 KEY POINTS'),iT=a.indexOf('💾 TAKEAWAY');
 if(a.indexOf('📋 OVERVIEW')<0)return '<div class="plain">'+inl(a)+'</div>';
 let ov=a.slice(a.indexOf('📋 OVERVIEW')+11,iK<0?a.length:iK).trim();
 const R={m:{},n:0};let h='<p class="ov">'+inl(ov,R)+'</p>';
 if(iK>=0){const kp=a.slice(iK+13,iT<0?a.length:iT).split('\n').map(x=>x.trim()).filter(x=>x.startsWith('-')||x.startsWith('•')).map(x=>x.replace(/^[-•]\s*/,''));
  h+='<ol class="kp">'+kp.map(k=>'<li>'+inl(k,R)+'</li>').join('')+'</ol>'}
 if(iT>=0){const rest=a.slice(iT+11);const parts=rest.split(/\n(?=\s*\d+\.\s*\[)/);const tk=parts[0].trim();
  if(tk)h+='<div class="take">'+inl(tk,R)+'</div>';
  const vl=rest.split('\n').map(x=>x.trim()).filter(x=>/WATCH VIDEO|READ REFERENCES/.test(x));
  if(vl.length)h+='<div class="vid">'+vl.map(x=>{const p=links(x).find(y=>y.u);if(!p)return '';const ref=/READ REFERENCES/.test(p.l);return '<a class="'+(ref?'ref':'')+'" href="'+esc(p.u)+'" target="_blank" rel="noopener">'+(ref?'■ READ ME — reference list for this video':esc(p.l))+'</a>'}).join('')+'</div>'}
 return h}
const ICON='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
async function ask(text){document.getElementById('welcome')?.remove();hist.push({role:'user',content:text});
 const d=document.createElement('section');d.innerHTML='<div class="q"></div><div class="ans"><span class="dots">Searching the lessons</span></div><div class="tools"></div>';d.querySelector('.q').textContent=text;chat.appendChild(d);window.scrollTo({top:Math.max(0,d.offsetTop-(document.documentElement.classList.contains('emb')?8:80)),behavior:'smooth'});
 const b=d.querySelector('.ans'),m=d.querySelector('.tools');const t0=performance.now();let ans='',first=0,fu=[];
 try{const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,session_id:sid})});
  if(!r.ok){b.textContent="KA-AI Chat is busy right now. Please try again in a moment.";return}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;const x=line.slice(5).trim();if(x==='[DONE]')continue;
    try{const j=JSON.parse(x);if(j.meta&&j.meta.followups)fu=j.meta.followups;const c=j.choices?.[0]?.delta?.content;if(c){if(!first)first=performance.now()-t0;ans+=c;b.innerHTML=render(ans)}}catch(e){}}}
  hist.push({role:'assistant',content:ans});
  const c=document.createElement('button');c.className='copy';c.title='Copy answer';c.innerHTML=ICON;
  c.onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text+'\n\n'+plain(ans)],{type:'text/plain'}),'text/html':new Blob(['<p><b>'+esc(text)+'</b></p>'+b.innerHTML],{type:'text/html'})})])}catch(e){try{await navigator.clipboard.writeText(text+'\n\n'+plain(ans))}catch(e2){}}c.innerHTML='✓ Copied';setTimeout(()=>c.innerHTML=ICON,1500)};
  if(fu.length){const f=document.createElement('div');f.className='fu';fu.forEach(t=>{const bt=document.createElement('button');bt.textContent=t;bt.onclick=()=>ask(t);f.appendChild(bt)});d.insertBefore(f,m)}
  m.appendChild(c);const s=document.createElement('span');s.textContent='First words '+(first/1000).toFixed(1)+' s · complete '+((performance.now()-t0)/1000).toFixed(1)+' s';m.appendChild(s);
 }catch(e){b.textContent="KA-AI Chat is busy right now. Please try again in a moment."}}
document.querySelectorAll('.starters button').forEach(x=>x.onclick=()=>ask(x.textContent));
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(t){q.value='';ask(t)}};
q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit()}};
</script></body></html>
